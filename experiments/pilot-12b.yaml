# The pilot with Gemma-4-12B as the learner (and, through editor.mode initial_policy, as the editor).
# The model reasons before every turn (enable_thinking in its model profile), so the editor keeps a
# turn's reasoning and replaces only its tool call. Learner and editor decode with Google's
# recommended settings for Gemma 4 (the pinned generation_config.json).
base: pilot.yaml
name: pilot-12b
learner:
  model_profile: gemma-4-12b-it
  max_context_tokens: 131072      # server window: editor requests hold a whole episode
episode:
  sampling: {temperature: 1.0, top_p: 0.95, top_k: 64, max_output_tokens: 16384}
  max_context_tokens: 32768       # every learner request (prompt + output) fits; all roles alike
  agent_timeout_sec: 3600         # reasoning turns take far longer than the E4B pilot's
editor:
  sampling: {temperature: 1.0, top_p: 0.95, top_k: 64, max_output_tokens: 16384}
  assistant_text_policy: keep_reasoning
training:
  dpo:
    max_length: null
    max_length_margin: 2048       # room for an edited turn longer than the original
    split_pair_backward: true     # long pairs: one sequence's activations at a time
