# Small learner for the bounded laptop smoke test and cheap pilots.
# Identity verified with huggingface_hub (model_info sha) and the local snapshot.
schema_version: 1
name: qwen3-0.6b
base_model: Qwen/Qwen3-0.6B
base_revision: c1899de289a04d12100db370d81485cdf75e47ca
# sha256 of tokenizer.chat_template at that revision; loading fails if it differs.
chat_template_sha256: a55ee1b1660128b7098723e0abcd92caa0788061051c62d51cbe87d9cf1974d8
# Thinking off: the generation prompt pre-fills an empty <think></think> block, so
# served turns carry no reasoning text (strict single-tool-call editing rejects it).
chat_template_kwargs:
  enable_thinking: false
tool_call_format: qwen3_xml        # <tool_call>{"name": ..., "arguments": {...}}</tool_call>
training_dtype: float32            # MPS-safe; bf16 is not assumed on Apple Silicon
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
supported_train_devices: [mps, cuda, cpu]
seed_supported: true               # hf_server seeds torch before sampling; not bitwise-portable
serving:
  hf_transformers:
    backend: hf_transformers
    adapter_formats: [peft_lora]
    status: tested
    notes: >-
      learning_loop.serving.hf_server, serial, unmerged PEFT adapter. Tested on MPS with a
      trained smoke adapter (tests/train/test_train_serve_smoke.py) and on CUDA (Runpod RTX 3090),
      including a remotely trained adapter served on the pod during a run.
  vllm:
    backend: vllm
    adapter_formats: [peft_lora]
    status: untested
    engine_package: vllm==0.30.0
    notes: >-
      hf_server --engine vllm: our renderer, parser and token counts around vLLM generation from
      token ids; equivalence with hf_transformers is checked with learning_loop.serving.equivalence.
notes: >-
  Training validated on MPS (laptop) and CUDA (Runpod RTX 3090: tests/train and remote training
  runs). The profile pins the trainable source checkpoint; there is no separate quantized
  serving artifact.
