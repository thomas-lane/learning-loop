# The first all-E4B experiment's split over the 34 calibrated families.
# Ten families never appear in training: the whole config-repair cluster, to measure transfer to
# a kind of task the learner never trained on, and one family from five other clusters, to measure
# transfer to a new task of a familiar kind. Each trained family has 4 train instances, 1 dev
# instance and 2 final instances per difficulty; each held-out family has 2 final instances per
# difficulty. Seed ranges are disjoint per split and outside the reserved calibration range.
schema_version: 1
name: first-e4b
description: 24 trained families; config-repair and five single families held out.
held_out_families: [bulk-rename, cron-translate, csv-revenue, env-reconcile, fix-dates, fix-json-config, resolve-conflicts, session-count, toml-migrate, write-validator]

