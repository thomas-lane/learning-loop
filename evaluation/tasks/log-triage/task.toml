# Harbor task config. Full schema: TaskConfig in harbor/models/task/config.py
schema_version = "1.4"
# Separate verifier: only /app/answer.txt is copied from the agent's container into a
# fresh grading container built from tests/ (the hidden test never enters the agent's container).
artifacts = ["/app/answer.txt"]

[metadata]
difficulty = "easy"
category = "shell"
# The trap: the answer changes if you skip the rotated/gzipped logs.
tags = ["logs", "gzip", "trap:rotated-logs"]
family = "log-triage"
skills = ["shell", "logs", "gzip", "aggregation"]

# Replay contract used by the learning loop (see evaluation/README.md).
[metadata.learning_loop]
restore = "deterministic_replay"
fingerprint_paths = ["/app"]
fingerprint_exclude = []
success_threshold = 1.0
reward_key = "reward"
observation_normalizers = [{ pattern = "\\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) [ \\d]\\d (?:\\d\\d:\\d\\d| \\d{4})\\b", replacement = "<mtime>", reason = "ls -l shows modification times of files written during the episode; they depend on wall-clock time" }]

[agent]
timeout_sec = 300.0          # wall-clock budget for agent.run()

[verifier]
timeout_sec = 60.0           # budget for tests/test.sh
environment_mode = "separate"

[environment]
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
