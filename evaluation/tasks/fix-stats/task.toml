schema_version = "1.4"
# Separate verifier: only /app/stats.py is copied into a fresh grading container built from tests/.
artifacts = ["/app/stats.py"]

[metadata]
difficulty = "easy"
category = "debugging"
tags = ["python", "partial-credit"]
family = "fix-stats"
skills = ["python", "debugging", "reading-docs"]

[metadata.learning_loop]
restore = "deterministic_replay"
fingerprint_paths = ["/app"]
# Bytecode caches embed source mtimes (wall-clock dependent); they are regenerated from the sources.
fingerprint_exclude = ["*/__pycache__"]
success_threshold = 1.0
reward_key = "reward"
observation_normalizers = [{ pattern = "\\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) [ \\d]\\d (?:\\d\\d:\\d\\d| \\d{4})\\b", replacement = "<mtime>", reason = "ls -l shows modification times of files written during the episode; they depend on wall-clock time" }]

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 60.0
environment_mode = "separate"

[environment]
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
